name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    # main is included so formatting and checks are verified after a merge, not
    # only on the pull request. Without it, drift can land on main unnoticed.
    branches: [dev, main]


concurrency:
  # Auto-cancel superseded runs for same workflow+ref/PR (the operator 2026-07-14)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  optimize-ci:
    name: Graphite CI Optimizer
    if: github.event_name == 'pull_request'
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check-skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check-skip
        uses: withgraphite/graphite-ci-action@402a89bc8aa6db18ae1f9c61953d001d5f9d828f # main
        with:
          graphite_token: ${{ secrets.GRAPHITE_CI_TOKEN }}

  lint-and-check:
    if: always() && (github.event_name != 'pull_request' || needs.optimize-ci.outputs.skip == 'false')
    needs: optimize-ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd claude-ops && npm ci

      - name: Syntax check (Node scripts)
        run: |
          node --check claude-ops/bin/ops-slack-autolink.mjs
          node --check claude-ops/bin/ops-telegram-autolink.mjs
          node --check claude-ops/telegram-server/index.js

      - name: Syntax check (Shell scripts)
        run: |
          bash -n claude-ops/bin/ops-merge-scan
          bash -n claude-ops/bin/ops-prs
          bash -n claude-ops/bin/ops-ci
          bash -n claude-ops/bin/ops-git
          bash -n claude-ops/bin/ops-infra
          bash -n claude-ops/bin/ops-unread
          bash -n claude-ops/bin/ops-gather
          bash -n claude-ops/bin/ops-setup-detect
          bash -n claude-ops/bin/ops-setup-install
          bash -n claude-ops/bin/ops-projects
          bash -n claude-ops/scripts/ops-gsd-registry-sync.sh

      - name: Prettier check
        run: cd claude-ops && npx prettier --check "**/*.{js,mjs,json}" --ignore-path .gitignore

      - name: Install gitleaks
        run: |
          curl -sSfL --retry 3 --retry-delay 5 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz
          chmod +x gitleaks
      - name: Run gitleaks
        run: ./gitleaks detect --source . --config claude-ops/.gitleaks.toml --verbose

  # Dedicated, INDEPENDENT gate against personal data (PII) reaching this PUBLIC
  # repo — contributor usernames, home paths, personal emails, AWS account IDs,
  # phone numbers. Runs with no `needs:` so it executes on every PR regardless of
  # the optimizer or secret-scan job's state. Catches the class that leaked into
  # history (scrubbed 2026-06-07).
  pii-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PII / personal-data scan
        run: bash claude-ops/tests/test-no-secrets.sh
      - name: Hashed identity scan of every tracked file
        run: bash claude-ops/bin/ops-pii-scan --tracked

  # The companion to `pii-gate`, for everything that is NOT a file.
  #
  # `pii-gate` scans tracked file content. On 2026-09-16 a personal name reached
  # a public commit message AND a public pull-request body, and `pii-gate`
  # passed every time, because neither of those is a file. This job closes that:
  # commit messages in the PR range, the PR title and body, the head branch
  # name, and the plugin manifests' owner/author fields.
  #
  # No `needs:`, for the same reason `pii-gate` has none — it must run on every
  # PR regardless of the optimizer's verdict.
  #
  # FORK-SAFE BY CONSTRUCTION: it reads the `pull_request` event payload and the
  # git history that checkout already fetched. No gh api call, no secret, so it
  # behaves identically on a fork PR, where secrets are unavailable.
  pii-gate-metadata:
    name: pii-gate-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR range needs both endpoints, so the shallow default will not
          # do. `fetch-depth: 0` is the honest way to say "we need history".
          fetch-depth: 0
      - name: Commit messages in the PR range
        if: github.event_name == 'pull_request'
        run: |
          bash claude-ops/bin/ops-pii-scan \
            --commit-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: PR title and body
        if: github.event_name == 'pull_request'
        # Passed through env, never interpolated into the shell: a PR title is
        # attacker-controlled text and `${{ }}` inside `run:` is a command
        # injection, not a variable.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > /tmp/pr-text.txt
          bash claude-ops/bin/ops-pii-scan --origin "PR title/body" --text-file /tmp/pr-text.txt
      - name: Head branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash claude-ops/bin/ops-pii-scan --branch "$HEAD_REF"
      - name: Plugin and marketplace manifests
        run: bash claude-ops/bin/ops-pii-scan --manifests

  test-suite:
    if: always() && needs.lint-and-check.result == 'success' && (github.event_name != 'pull_request' || needs.optimize-ci.outputs.skip == 'false')
    runs-on: ${{ matrix.os }}
    needs: [optimize-ci, lint-and-check]
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get install -y shellcheck 2>/dev/null || true
      - name: Run full test suite
        run: bash claude-ops/tests/run-all.sh
        env:
          CI: true
