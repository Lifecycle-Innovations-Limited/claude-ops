name: PII surfaces audit

# WHY THIS IS SCHEDULED AND NOT A PR CHECK
#
# `pii-gate` covers tracked files and `pii-gate-metadata` covers a pull
# request's own commits, title, body and branch. Neither can see a surface that
# changes OUTSIDE a pull request — and four of them do:
#
#   the wiki       `ops-release` pushes to it on every release
#   releases       generated by `ops-release`, never reviewed in a PR
#   issue comments written by bots and humans, never reviewed at all
#   PR comments    the weakest surface; bots paste diffs into them
#
# A PR-triggered job would report clean forever while any of these drifted. So
# this runs daily and fails loudly, with the findings in the job summary.

on:
  schedule:
    # 06:20 UTC. Deliberately not on the hour: a scheduled run competing with
    # the top-of-hour rush is the one that silently gets dropped.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pii-surfaces-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone the wiki
        # The wiki is a separate git repository with its own history. A missing
        # wiki must not fail the job, but it must be visible in the log — a
        # silently skipped surface is how this class of bug started.
        run: |
          if git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" /tmp/wiki 2>/dev/null; then
            echo "wiki pages: $(find /tmp/wiki -maxdepth 2 -name '*.md' | wc -l)"
          else
            echo "NOTE: no wiki clone available — the wiki was NOT scanned."
          fi

      - name: Scan wiki
        if: always()
        run: |
          if [[ -d /tmp/wiki ]]; then
            bash claude-ops/bin/ops-pii-scan --wiki-dir /tmp/wiki | tee -a /tmp/audit.txt
          fi

      - name: Scan manifests
        if: always()
        run: bash claude-ops/bin/ops-pii-scan --manifests | tee -a /tmp/audit.txt

      - name: Scan releases, issue comments and PR comments
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `uuid-literal` is demoted on this surface ONLY. A sweep of this repo's
        # comment history returns 2090 UUID hits against 47 of everything else,
        # and essentially all 2090 are review bots quoting a diff — the bot is
        # reporting a leak, not creating one. Leaving it as a blocker would
        # paint the audit permanently red for a reason nobody can act on, and a
        # permanently red gate is a muted gate. Every high-signal rule
        # (personal email, home paths, AWS account id, operator identity) still
        # fails this job.
        run: |
          bash claude-ops/bin/ops-pii-scan \
            --github "${{ github.repository }}" \
            --downgrade uuid-literal | tee -a /tmp/audit.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo '## PII surfaces audit'
            echo ''
            echo '```'
            cat /tmp/audit.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `| tee` makes each scan step exit 0 whatever the scanner returned,
          # so THIS is the check that fails the job. It is not a belt-and-braces
          # re-assertion; without it the audit would print BLOCKED and go green,
          # which is the exact shape of the bug this whole gate exists for.
          if grep -q 'BLOCKED' /tmp/audit.txt 2>/dev/null; then
            echo "PII found on a GitHub surface outside the code tree."
            exit 1
          fi
